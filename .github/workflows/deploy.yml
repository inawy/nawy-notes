name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint # فشله يوقف النشر
      - run: npm test # الاختبارات أولاً: فشلها يوقف النشر
      - run: npm run build # يتضمن فحص الأنواع (tsc --noEmit)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  e2e:
    # اختبارات المتصفح الحقيقي (IndexedDB حقيقية): فشلها يوقف النشر
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm i --no-save @playwright/test@1.56.0
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results

  deploy:
    needs: [build, e2e]
    if: github.event_name != 'pull_request' # الطلبات تُفحص فقط ولا تُنشر
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
